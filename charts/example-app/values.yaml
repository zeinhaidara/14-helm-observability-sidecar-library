replicaCount: 2

image:
  repository: example.com/example-app
  tag: "1.0.0"

observabilitySidecars:
  securityContext:
    runAsUser: 1000
    fsGroup: 1000

  prometheus:
    enabled: true
    image:
      repository: prom/prometheus
      tag: v2.54.1
    port: 9090
    resources: {}

  fluentbit:
    enabled: true
    image:
      repository: fluent/fluent-bit
      tag: 3.1.9
    configMapName: example-app-fluent-bit-config
    resources: {}
