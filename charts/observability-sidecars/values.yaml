# Default shape for the observabilitySidecars block. Consumer charts nest
# their own values under this same key; the consumer's values always win
# over these when the chart is actually rendered. These defaults only
# matter when linting/templating this library chart on its own.
observabilitySidecars:
  securityContext:
    runAsUser: 1000
    fsGroup: 1000

  prometheus:
    enabled: true
    image:
      repository: prom/statsd-exporter
      tag: v0.27.2
    port: 9102
    resources:
      limits:
        cpu: 100m
        memory: 128Mi
      requests:
        cpu: 50m
        memory: 64Mi

  fluentbit:
    enabled: true
    image:
      repository: fluent/fluent-bit
      tag: 3.1.9
    configMapName: fluent-bit-config
    resources:
      limits:
        cpu: 100m
        memory: 128Mi
      requests:
        cpu: 50m
        memory: 64Mi
